name: Feature request
description: An idea for a new tile, popup or setting.
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you would like to have, and how it could look.
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Sketch or example
      description: A drawing, a screenshot, or how another app does it.
