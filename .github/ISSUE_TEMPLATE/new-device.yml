name: New device support
description: A display that HomeTiles does not support yet.
labels: [enhancement]
body:
  - type: input
    id: model
    attributes:
      label: Exact model
      description: From the label on the back.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Product page
      description: Link to the maker's page.
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip revision
      description: Run `esptool chip-id`.
    validations:
      required: true
  - type: dropdown
    id: test
    attributes:
      label: Can you test a build on it?
      description: It can only be supported after a test.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
