name: Report a problem or an idea
description: Something does not work, an idea, or a new device.
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is it about
      options:
        - Something does not work
        - An idea or a wish
        - Support for a new device
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: The image you flashed.
      options:
        - M5Stack Tab5
        - Waveshare 4B / 86 Panel
        - Waveshare Touch LCD 4.3 inch
        - Waveshare Touch LCD 5 inch (ESP32-P4 before v3.0)
        - Waveshare Touch LCD 5 inch (ESP32-P4 v3.1 or newer, experimental)
        - Waveshare Touch LCD 7 inch
        - Waveshare Touch LCD 7B / 7B-C (ESP32-P4 before v3.0)
        - Waveshare Touch LCD 7B / 7B-C (ESP32-P4 v3.1 or newer, experimental)
        - Waveshare Touch LCD 8 inch
        - Waveshare Touch LCD 10.1 inch
        - Waveshare Touch LCD 10.1 inch (ESP32-P4 v3.1 or newer, experimental)
        - Waveshare ESP32-S3 Touch LCD 4 (Rev 4.0)
        - Waveshare ESP32-S3 Touch LCD 4B
        - Guition JC8012P4A1 V1
        - Guition JC8012P4A1 V2
        - Guition JC8012P4A1 V3 (experimental)
        - Guition JC1060P470C_I_W_Y
        - Guition JC1060P470C V2 (New Panel)
        - Guition JC4880P443C_I_W
        - Guition ESP32-4848S040C_I
        - Golden Security GS-T3E v2 (PCB v2.3)
        - Not listed (new device)
        - Not about one device
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: HomeTiles version
      description: Web Admin > Settings > System, for example 0.9.3. "none" if it is not installed.
    validations:
      required: true
  - type: input
    id: bridge
    attributes:
      label: HomeTiles Bridge version
      description: Home Assistant > HACS > HomeTiles Bridge, for example 0.9.3. "none" if it is not installed.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Something does not work: what happens, what you expected, and the steps to get there (tile type, entity, what you tap).
        An idea: what you want to do at home and how it could look.
        A new device: the exact model from the rear label, the product page and the output of `esptool.py chip_id`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log and logs
      description: |
        - Crash log: Web Admin > Settings > Screenshot & Diagnostics > Download crash log
        - Panel log: [Device logs](https://galusperes.github.io/device-logs/) (USB, Chrome or Edge)
        - Home Assistant log: Settings > System > Logs
  - type: textarea
    id: pictures
    attributes:
      label: Photos or screenshots
