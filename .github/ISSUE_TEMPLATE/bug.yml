name: Bug report
description: Something on the panel or in the Web Admin does not work.
labels: [bug]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: The image you flashed.
      options:
        - Choose your device
        - M5Stack Tab5
        - Waveshare 4B / 86 Panel
        - Waveshare Touch LCD 4.3 inch
        - Waveshare Touch LCD 5 inch (ESP32-P4 before v3.0)
        - Waveshare Touch LCD 5 inch (ESP32-P4 v3.1 or newer, experimental)
        - Waveshare Touch LCD 7 inch
        - Waveshare Touch LCD 7B / 7B-C (ESP32-P4 before v3.0)
        - Waveshare Touch LCD 7B / 7B-C (ESP32-P4 v3.1 or newer, experimental)
        - Waveshare Touch LCD 8 inch
        - Waveshare Touch LCD 10.1 inch
        - Waveshare Touch LCD 10.1 inch (ESP32-P4 v3.1 or newer, experimental)
        - Waveshare ESP32-S3 Touch LCD 4 (Rev 4.0)
        - Waveshare ESP32-S3 Touch LCD 4B
        - Guition JC8012P4A1 V1
        - Guition JC8012P4A1 V2
        - Guition JC8012P4A1 V3 (experimental)
        - Guition JC1060P470C_I_W_Y
        - Guition JC1060P470C V2 (New Panel)
        - Guition JC4880P443C_I_W
        - Guition ESP32-4848S040C_I
        - Golden Security GS-T3E v2 (PCB v2.3)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: HomeTiles version
      description: Web Admin > Settings > System
    validations:
      required: true
  - type: input
    id: bridge
    attributes:
      label: HomeTiles Bridge version
      description: HACS > HomeTiles Bridge
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What goes wrong, and how to make it happen again.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        - After a crash or restart: Web Admin > Settings > Screenshot & Diagnostics > crash log and core dump (core dump as .zip, it can contain entity names)
        - Live log over USB: [Device logs](https://galusperes.github.io/device-logs/)
        - Home Assistant log: Settings > System > Logs, filter `tab5_lvgl`
  - type: textarea
    id: pictures
    attributes:
      label: Photos or screenshots
      description: A photo of the panel helps with display problems.
